name: localstack-smoke

# The LocalStack dev-loop smoke in CI: the boto3 read-path smoke (`just smoke`) proving the verifier's
# Cloud Control read path against LocalStack (DECISIONS.md §1). Needs the LOCALSTACK_AUTH_TOKEN repo secret.
on:
  pull_request:
    paths:
      - "py/packages/infra-local/**"
      - "justfile"
      - ".github/workflows/localstack-smoke.yml"
      - "package.json"
      - "bun.lock"
      - "uv.lock"
      - ".python-version"
  push:
    branches: [main]
    paths:
      - "py/packages/infra-local/**"
      - "justfile"
      - ".github/workflows/localstack-smoke.yml"
      - "package.json"
      - "bun.lock"
      - "uv.lock"
      - ".python-version"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.8"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.53.0" # pin the binary, not just the action SHA (repo "pin everything" rule)
      - run: bun install --frozen-lockfile
      - run: uv sync --locked
      # Token scoped to the one step that needs it (starting LocalStack), not the install/setup steps.
      - name: Start LocalStack
        run: just up
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - run: just smoke
      - if: always()
        run: just down
