name: localstack-smoke

# The infra-local LocalStack dev loop, run in CI. LocalStack for AWS is licensed, so this needs a
# CI auth token in the LOCALSTACK_AUTH_TOKEN repo secret (Settings -> Secrets -> Actions). Scoped to
# the dev-loop paths so unrelated PRs do not consume metered LocalStack CI usage.
on:
  pull_request:
    paths:
      - "infra-local/**"
      - "justfile"
      - ".github/workflows/localstack-smoke.yml"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "infra-local/**"
      - "justfile"
      - ".github/workflows/localstack-smoke.yml"
      - "bun.lock"

permissions:
  contents: read

jobs:
  smoke:
    # Only run the secret-backed smoke on trusted refs (pushes + same-repo PRs). Fork PRs never
    # receive the token secret, so skip them: no token in untrusted PR code, no permanently-red check.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: bun install --frozen-lockfile
      # Token scoped to the one step that needs it (starting LocalStack), not the install/setup steps.
      - name: Start LocalStack
        run: just up
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - run: just smoke
      - if: always()
        run: just down
