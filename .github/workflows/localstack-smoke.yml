name: localstack-smoke

# The infra-local LocalStack dev loop in CI. Licensed LocalStack needs the LOCALSTACK_AUTH_TOKEN repo
# secret (Settings -> Secrets -> Actions), scoped to only the `just up` step.
#
# Runs on same-repo PRs (pre-merge validation), pushes to main, and manual dispatch; fork PRs are skipped
# (GitHub never passes secrets to fork runs, so they would only fail). The trigger is a validation choice,
# not secret protection: per GitHub, any user with write access can already read every repo secret, so a
# same-repo PR exposes nothing new. To actually gate the token from collaborators, promote it to an
# Environment secret with required reviewers (works with this pull_request trigger).
on:
  pull_request:
    paths:
      - "infra-local/**"
      - "justfile"
      - ".github/workflows/localstack-smoke.yml"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "infra-local/**"
      - "justfile"
      - ".github/workflows/localstack-smoke.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # Skip fork PRs (no secret -> would only fail); same-repo PRs, pushes, and manual dispatch run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: bun install --frozen-lockfile
      # Token scoped to the one step that needs it (starting LocalStack), not the install/setup steps.
      - name: Start LocalStack
        run: just up
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - run: just smoke
      - if: always()
        run: just down
