name: ci

# The two-lane verify gate: the canonical `turbo run typecheck lint test` (= `bun run verify`), split
# into a TS lane (bun/turbo) and a Python lane (uv) that are independently cache-keyed and do not gate
# each other. Static checks only — this workflow holds zero account-B credentials (DECISIONS.md §1, §8).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-ts-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-ts-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run typecheck lint test --filter='!./py/**'

  py:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.8"
          enable-cache: true
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-py-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-py-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: uv sync --locked
      - run: bunx turbo run typecheck lint test --filter='./py/**'
