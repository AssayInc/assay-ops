name: ci

# The two-lane verify gate: the canonical `turbo run typecheck lint test` (= `bun run verify`), split
# into a TS lane (bun/turbo) and a Python lane (uv) that are independently cache-keyed and do not gate
# each other. The two filters partition all packages: the Python lane owns `./py/**` (the uv packages),
# the TS lane owns the rest. A third `codegen-parity` job enforces the one-schema-codegen gate (DECISIONS.md §8;
# see its comment below). Static checks only — this workflow holds zero account-B credentials
# (DECISIONS.md §1, §8).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-ts-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-ts-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run typecheck lint test --filter='!./py/**'

  py:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.8"
          enable-cache: true
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-py-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-py-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: uv sync --locked
      - run: bunx turbo run typecheck lint test --filter='./py/**'

  # The DECISIONS.md §8 one-schema-codegen gate (E1-4), as its own required job: regenerating from
  # contracts/schemas/ must reproduce the committed artifacts byte-for-byte, so a schema edit that skips
  # `just codegen` / `just vectors` fails here. The fix is ALWAYS to regenerate — never hand-edit a generated
  # file or the grader (contracts/vectors). It is a dedicated job (not folded into ts/py) because it spans
  # BOTH generators — quicktype (bun) + datamodel-codegen/gen_vectors (uv) — and it regenerates into the tree,
  # which the verify lanes must not do; a failed `codegen-parity` check then names the cause unambiguously. Byte-parity
  # (rfc8785 ↔ canonicalize, sha256) is asserted by the contracts tests in the ts + py verify lanes. Tools are
  # pinned (bun.lock / uv.lock) so regeneration is deterministic; holds zero account-B credentials.
  codegen-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.8"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.53.0" # pin the binary (not just the action SHA) — a required gate must be deterministic
      - run: bun install --frozen-lockfile
      - run: uv sync --locked
      - name: Codegen parity gate (regenerate from contracts/schemas and diff)
        run: |
          set -euo pipefail
          just codegen
          just vectors
          paths=(
            ts/packages/contracts/src/generated.ts
            py/packages/contracts/src/assayops_contracts/models
            contracts/vectors/jcs-golden.json
          )
          git add -A -- "${paths[@]}"
          if ! git diff --cached --quiet -- "${paths[@]}"; then
            echo "::error::Generated contract artifacts are stale — run \`just codegen\` && \`just vectors\` and commit the result. Never hand-edit generated files or contracts/vectors (DECISIONS.md §8)."
            git --no-pager diff --cached -- "${paths[@]}"
            exit 1
          fi
