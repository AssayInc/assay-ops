[project]
name = "assayops-iam-readiness-probe"
version = "0.0.0"
description = "Real-AWS IAM eventual-consistency probe (spike #60): times read-after-create + assume/use propagation for a fresh IAM role, to calibrate the verifier read path (E2) and episode-setup (E8) readiness gates. Mutates real AWS (creates/deletes one role+policy per trial); runs via `probe`, never the hermetic `bun run verify` gate."
requires-python = ">=3.12"
# No runtime deps: a measurement script using the pinned workspace dev `boto3` (root pyproject dev
# group) -- the verifier's read SDK -- reused, not re-declared.

[tool.uv]
package = false

[tool.ruff]
# Inherit the shared ruff config (line-length / target-version / lint.select) from the root pyproject
# via `extend` so the select stays single-sourced.
extend = "../../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true
# Ban explicit `Any` in hand-written code -- the Python mirror of the TS lane's `any` ban; `--strict`
# does NOT enable this. Use `object` (narrow before use) or a library type at the boundary.
disallow_any_explicit = true

[[tool.mypy.overrides]]
# boto3/botocore ship no py.typed (typed stubs live in the separate boto3-stubs). The probe's boundary
# is botocore's own `BaseClient` (an imported name, not a literal `Any`; `Any` at an untyped-third-party
# boundary is idiomatic per python-type-safety). Mirrors infra-local; #80/E2 can adopt boto3-stubs.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
