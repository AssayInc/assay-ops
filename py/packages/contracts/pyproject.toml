[project]
name = "assayops-contracts"
version = "0.0.0"
description = "AssayOps contract models (Pydantic v2) + RFC 8785 JCS canonicalization. Generated from contracts/schemas."
requires-python = ">=3.12"
# rfc8785 is a runtime dep: assayops_contracts.jcs canonicalizes records to the exact bytes the account-B
# reward ledger signs (DECISIONS.md I3). Pin matches the workspace dev group.
dependencies = ["pydantic>=2.10", "rfc8785>=0.1.4"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F/I/UP/B + ANN (ANN401 bans `Any` in signatures — the Python mirror of the TS `any` ban), S
# (flake8-bandit — security, for a trust-boundary verifier), LOG+G (structured logging, no bare `print`),
# ASYNC. mypy `disallow_any_explicit` (below) covers `Any` in field/variable annotations ANN401 can't.
select = ["E", "F", "I", "UP", "B", "ANN", "S", "ASYNC", "LOG", "G"]

[tool.ruff.lint.per-file-ignores]
# Generated by `just codegen` (datamodel-code-generator). The schema-description strings exceed the line
# limit and no formatter wraps a string literal; these modules are codegen output, not hand-maintained
# (so neither E501 nor ANN annotation-style applies). mypy --strict still typechecks them. See the
# justfile `codegen` recipe + docs/ARCHITECTURE.md.
"src/assayops_contracts/models/*.py" = ["E501", "ANN"]
# Tests assert (S101), use loose/`Any`-typed fixtures (ANN), and shell trusted `bun` for cross-lane byte
# parity (S603) — not the typed/security-critical core. S/ANN stay active in src.
"tests/**" = ["S101", "ANN", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Ban explicit `Any` in the hand-written core — the Python mirror of the TS lane's `any` ban. `--strict`
# does NOT enable this. Use `object` (must be narrowed before use, like TS `unknown`) or a Pydantic model.
module = ["assayops_contracts.*"]
disallow_any_explicit = true

[[tool.mypy.overrides]]
# Codegen output models open JSON-Schema objects as `Any` (generated, not hand-maintained); mypy --strict
# still typechecks it structurally. More specific than the package-wide ban above, so it wins here.
module = ["assayops_contracts.models.*"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
# boto3/botocore ship no py.typed (typed stubs live in the separate boto3-stubs). The reward-ledger
# primitives spike exercises the KMS/S3 boto3 call shapes in tests only; the real account-B ledger (E4)
# can adopt boto3-stubs there. moto ships py.typed, so it needs no override.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
