[project]
name = "assayops-contracts"
version = "0.0.0"
description = "AssayOps contract models (Pydantic v2). E0-1 shell; E1 generates the models from contracts/schemas."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Generated by `just codegen` (datamodel-code-generator). The schema-description strings exceed the line
# limit and no formatter wraps a string literal; these modules are codegen output, not hand-maintained.
# mypy --strict still typechecks them. See the justfile `codegen` recipe + docs/ARCHITECTURE.md.
"src/assayops_contracts/models/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
