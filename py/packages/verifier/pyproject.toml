[project]
name = "assayops-verifier"
version = "0.0.0"
description = "AssayOps account-B verifier core. E2-5 (#75): the golden-target generator — deterministic, content-addressed regeneration of the expected normalized resource set the verifier grades deployed state against (DECISIONS.md 2A/T1/§1). The engine, not the per-task golden corpus (#76)."
requires-python = ">=3.12"
# pydantic for the verifier-internal golden models. Two sibling cores are consumed by source path (the
# repo's virtual-member convention — see the pytest `pythonpath` + mypy `mypy_path` below): the contract
# spine `assayops_contracts` (TaskSpec input + the single-sourced JCS canonicalization for the content
# address) and the shared reward core `assayops_diff_ir` (E3-1/#34 — `grade` + the NormalizedState IR the
# golden is bridged into for grading; E2-2/#31). Both, and their rfc8785 dep, are already in the shared
# workspace venv. No agent-reachable / signing / cloud-write deps: this is account-B-pure verifier code
# (DECISIONS.md §8).
dependencies = ["pydantic>=2.10"]

[tool.uv]
package = false

[tool.ruff]
# Shared ruff config (line-length / target-version / lint.select) lives in the root pyproject; inherit it
# via `extend` so the select stays single-sourced. Only this package's per-file-ignores are local.
extend = "../../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101), use loose/`Any`-typed synthetic builders/fixtures (ANN), and spawn a trusted
# subprocess (S603 — the cross-hash-seed determinism check) — not the typed, security-critical core.
"tests/**" = ["S101", "ANN", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
# pydantic.mypy synthesizes typed model __init__s. With init_typed + init_forbid_extra (below) it drops
# the plugin's synthesized `Any`, so hand-written Pydantic models pass `disallow_any_explicit` — the
# pydantic-v2 skill's repo-wide fix for the explicit-Any-vs-Pydantic gotcha.
plugins = ["pydantic.mypy"]
# Resolve this package AND the two siblings it consumes: the contracts spine (TaskSpec + jcs) and the
# diff-ir reward core (`grade` + NormalizedState). `uv run mypy` runs from the package dir, so the sibling
# sources are `../contracts/src` and `../diff-ir/src`. Cross-package imports are consumed by source path
# here (the repo's virtual-member convention), keeping the landed packages untouched.
mypy_path = "src:../contracts/src:../diff-ir/src"

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[[tool.mypy.overrides]]
# Ban explicit `Any` in the hand-written verifier core — the Python mirror of the TS lane's `any` ban.
# `--strict` does NOT enable this. Use `object` (narrow before use, like TS `unknown`) or a Pydantic model.
module = ["assayops_verifier.*"]
disallow_any_explicit = true

[[tool.mypy.overrides]]
# contracts is a separately-typechecked package (its own CI lane). Follow it for the real `TaskSpec` /
# `canonical_digest` types, but `silent` so its codegen models' intentional `Any` is not re-judged under
# this package's stricter config (and `disallow_any_explicit` off here mirrors contracts' own models override).
module = ["assayops_contracts.*"]
follow_imports = "silent"
disallow_any_explicit = false

[[tool.mypy.overrides]]
# diff-ir is likewise separately-typechecked under its OWN strict + disallow_any_explicit lane. Follow it for
# the real `grade` / `NormalizedState` / `GradeOutcome` types, but `silent` so its internals (and the
# contracts `Any` it transitively follows) aren't re-judged under this package's run. Mirrors the contracts
# override; diff-ir's public surface is `Any`-free, so this only avoids double-judging, never hides an `Any`.
module = ["assayops_diff_ir.*"]
follow_imports = "silent"
disallow_any_explicit = false

[tool.pytest.ini_options]
pythonpath = ["src", "../contracts/src", "../diff-ir/src"]
testpaths = ["tests"]
