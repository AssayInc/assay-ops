[project]
name = "assayops-read-smoke"
version = "0.0.0"
description = "LocalStack boto3 smoke proving the verifier's Cloud Control read path (get_resource/list_resources) — the Python counterpart to infra-local's TS smoke; the read-path seed that grounds the #80 verifier read-coverage spike. Runs only via `just smoke-py` (needs LocalStack), never in the hermetic `bun run verify` gate."
requires-python = ">=3.12"
# No runtime deps: this is a test-only smoke run against LocalStack. boto3 (the verifier's read SDK) is
# the pinned workspace dev `boto3` (root pyproject dev group) — reused, not re-declared.

[tool.uv]
package = false

[tool.ruff]
# Shared ruff config (line-length / target-version / lint.select) lives in the root pyproject; inherit it
# via `extend` so the select stays single-sourced. Only this package's per-file-ignores are local.
extend = "../../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# The smoke asserts (S101) and reads boto3's open dict responses with loose typing (ANN), like the other
# packages' tests. S/ANN stay active where there is real risk; this package is a LocalStack smoke only.
"tests/**" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
# Ban explicit `Any` in hand-written code — the Python mirror of the TS lane's `any` ban; `--strict` does
# NOT enable this. Use `object` (narrow before use, like TS `unknown`) or a library type at the boundary.
disallow_any_explicit = true

[[tool.mypy.overrides]]
# boto3/botocore ship no py.typed (typed stubs live in the separate boto3-stubs). The smoke exercises the
# Cloud Control read call shapes against LocalStack; the boundary is typed via botocore's own `BaseClient`
# (an imported name, not a literal `Any`). Mirrors the contracts package; #80/E2 can adopt boto3-stubs.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
