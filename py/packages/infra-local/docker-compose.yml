# LocalStack dev loop for the verifier's Cloud Control read path.
# Licensed "LocalStack for AWS": the free tokenless community edition was retired in the
# 2026-03-23 single-image change, so this requires LOCALSTACK_AUTH_TOKEN (a secret, never committed;
# see README.md). Image pinned by digest for reproducibility.
services:
  localstack:
    container_name: assayops-localstack
    # localstack/localstack 2026.5.4 (LocalStack for AWS), pinned by digest.
    image: localstack/localstack@sha256:2d9f647286f00a4a7c0b5d4984dc24043385f42c3ae5ce6585102045a3f57430
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      # `just up` loads the token (from the env or .env) and enforces it; left optional here so
      # `just down` / `just logs` work without it (they do not start the licensed container).
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      DEBUG: ${DEBUG:-0}
    # No /var/run/docker.sock mount: only Docker-backed services (e.g. Lambda) need it; S3 + Cloud Control do not.
